<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>红橙果园 - 阀门控制</title>
  <link rel="stylesheet" href="/assets/styles.css?v=20260606b">
  <link rel="stylesheet" href="/assets/valve.css?v=20260606a">
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <div class="logo-wrap">
        <div class="logo-icon">Y</div>
        <div class="logo-text">红橙果园</div>
      </div>
      <nav class="menu">
        <a class="menu-item menu-link" href="/">概览分析</a>
        <a class="menu-item menu-link" href="/diagnosis">智能诊断</a>
        <button class="menu-item is-active" type="button">阀门控制</button>
        <a class="menu-item menu-link" href="/yolo">视觉诊断</a>
      </nav>
      <button class="collapse-btn" id="collapseBtn" type="button">收起侧栏</button>
    </aside>

    <main class="valve-screen">
      <header class="valve-header">
        <h1>六区域阀门控制台</h1>
        <p id="valveHint">正在加载区域数据...</p>
      </header>

      <section class="zone-section" id="zoneSelector"></section>

      <section class="control-grid">
        <article class="control-card sensor-card">
          <div class="card-head">
            <h3 id="sensorTitle">Zone_1 传感器（10项）</h3>
            <span id="sensorTimestamp">--</span>
          </div>
          <div class="sensor-list" id="sensorList"></div>
        </article>

        <article class="control-card valve-card">
          <div class="card-head">
            <h3>当前区域阀门开关</h3>
            <span id="valveZoneText">Zone_1</span>
          </div>

          <div class="valve-center">
            <div class="valve-row">
              <div class="valve-label">水阀</div>
              <div class="valve-status" id="waterValveStatus">当前状态：关闭</div>
              <div class="valve-duration">
                <label>
                    <input class="duration-input" id="waterDurationHours" type="number" min="0" max="24" value="0">                  
                    <span>时</span>
                </label>
                <label>
                  <input class="duration-input" id="waterDurationMinutes" type="number" min="0" max="59" value="2">
                    <span>分</span>
                </label>
                <label>
                  <input class="duration-input" id="waterDurationSeconds" type="number" min="0" max="59" value="0">
                    <span>秒</span>
                </label>
              </div>
              <button class="valve-btn is-off" id="waterValveBtn" type="button">关闭</button>
            </div>

            <div class="valve-row">
              <div class="valve-label">肥阀</div>
              <div class="valve-status" id="fertValveStatus">当前状态：关闭</div>
              <button class="valve-btn is-off" id="fertValveBtn" type="button">关闭</button>
            </div>
          </div>
        </article>
      </section>

      <section class="auto-control">
        <button class="auto-control-btn" id="autoControlBtn" type="button">开启全自动化管理</button>
        <p class="auto-control-text" id="autoControlText">如您想全自动化管理，请点击该按钮开启</p>
        <p class="auto-control-desc">如果开启该按钮，智能体将自动接管水肥阀门控制，智能体分辨可能有误差，可以考虑是否启动</p>
      </section>
    </main>
  </div>

  <div class="valve-modal" id="valveModal" aria-hidden="true">
    <div class="valve-modal-backdrop" data-action="close"></div>
    <div class="valve-modal-card" role="alert" aria-live="assertive">
      <div class="valve-modal-title">操作失败</div>
      <div class="valve-modal-message" id="valveModalMessage">--</div>
      <button class="valve-modal-btn" data-action="close" type="button">知道了</button>
    </div>
  </div>

  <div class="auto-modal" id="autoModal" aria-hidden="true">
    <div class="auto-modal-backdrop" data-auto-action="close"></div>
    <div class="auto-modal-card" role="dialog" aria-modal="true" aria-label="全自动化管理流程图">
      <button class="auto-modal-close" data-auto-action="close" type="button" aria-label="关闭">×</button>
      <img class="auto-modal-image" src="/assets/lct.png" alt="全自动化管理流程图">
      <p class="auto-modal-desc">原理如图所示</p>
    </div>
  </div>

  <script src="/assets/valve.js?v=20260606a"></script>
</body>
</html>
